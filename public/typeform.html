<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Typeform / Jotform Cards Style Survey Component</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }
    .slide-enter-down {
      animation: enterDown 0.3s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
    }
    .slide-exit-up {
      animation: exitUp 0.24s cubic-bezier(0.4, 0, 1, 1) forwards;
    }
    .slide-enter-up {
      animation: enterUp 0.3s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
    }
    .slide-exit-down {
      animation: exitDown 0.24s cubic-bezier(0.4, 0, 1, 1) forwards;
    }
    @keyframes enterDown {
      0% { opacity: 0; transform: translateY(40px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes exitUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-40px); }
    }
    @keyframes enterUp {
      0% { opacity: 0; transform: translateY(-40px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes exitDown {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(40px); }
    }
  </style>
</head>
<body class="bg-[#f4eff4] text-neutral-800 m-0 p-0 overflow-hidden select-none">
  <!-- Top Progress Bar -->
  <div class="w-full h-1 bg-neutral-200/60 fixed top-0 left-0 z-30">
    <div id="progress-fill" class="h-full bg-[#e91e63] transition-all duration-300 ease-out" style="width: 25%;"></div>
  </div>

  <!-- Main Viewport -->
  <main class="w-full h-screen min-h-[600px] flex items-center justify-center px-4 sm:px-8 py-12 max-w-2xl mx-auto z-10 relative">
    <div id="card-container" class="w-full flex flex-col justify-center slide-enter-down">
      <!-- Rendered dynamically -->
    </div>
  </main>

  <!-- Fixed Bottom-Right Navigation Widget -->
  <footer class="fixed bottom-4 right-4 sm:bottom-6 sm:right-6 z-20 flex items-center gap-3">
    <!-- Up / Down Chevrons Button Group -->
    <div class="flex items-center bg-white/90 backdrop-blur-sm border border-neutral-200/90 rounded-lg shadow-sm overflow-hidden">
      <!-- Chevron Up (Prev) -->
      <button
        id="btn-nav-prev"
        type="button"
        aria-label="Previous question"
        class="p-2 sm:p-2.5 text-neutral-600 hover:text-neutral-900 hover:bg-neutral-100 disabled:opacity-30 disabled:hover:bg-transparent disabled:cursor-not-allowed transition-colors"
      >
        <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7" />
        </svg>
      </button>

      <div class="w-[1px] h-5 bg-neutral-200"></div>

      <!-- Chevron Down (Next) -->
      <button
        id="btn-nav-next"
        type="button"
        aria-label="Next question"
        class="p-2 sm:p-2.5 text-neutral-600 hover:text-neutral-900 hover:bg-neutral-100 disabled:opacity-30 disabled:hover:bg-transparent disabled:cursor-not-allowed transition-colors"
      >
        <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
        </svg>
      </button>
    </div>

    <!-- Progress / Brand Pill -->
    <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 bg-white/80 backdrop-blur-sm border border-neutral-200/80 rounded-lg shadow-xs text-xs font-medium text-neutral-500">
      <span id="brand-step-counter">1 of 4</span>
      <span class="text-neutral-300">|</span>
      <span class="text-neutral-400 font-normal">Typeform style</span>
    </div>
  </footer>

  <script>
    const QUESTIONS = [
      {
        id: 1,
        title: 'What is your primary focus area right now?',
        description: 'Select the dimension that currently commands the most intentional energy.',
        required: true,
        options: [
          { id: 'career', badge: 'A', label: 'Career advancement & leadership impact' },
          { id: 'health', badge: 'B', label: 'Physical health, vitality & sleep rhythms' },
          { id: 'relationships', badge: 'C', label: 'Deepening friendships and family bonds' },
          { id: 'mindset', badge: 'D', label: 'Mindset, intellectual curiosity & inner peace' }
        ]
      },
      {
        id: 2,
        title: 'How often do you dedicate dedicated time to reflection or journaling?',
        description: 'Think about your regular rhythm over the last 90 days.',
        required: true,
        options: [
          { id: 'daily', badge: 'A', label: 'Daily or nearly every day' },
          { id: 'weekly', badge: 'B', label: 'Once or twice a week consistently' },
          { id: 'monthly', badge: 'C', label: 'A few times a month when time permits' },
          { id: 'rarely', badge: 'D', label: 'Rarely or almost never' }
        ]
      },
      {
        id: 3,
        title: 'What kind of growth would benefit you most right now?',
        description: 'Choose the breakthrough that would create the highest leverage in your life.',
        required: true,
        options: [
          { id: 'clarity', badge: 'A', label: 'Crystal-clear clarity on long-term vision and goals' },
          { id: 'consistency', badge: 'B', label: 'Daily consistency and discipline in execution' },
          { id: 'boundaries', badge: 'C', label: 'Better boundaries around rest and digital recovery' },
          { id: 'community', badge: 'D', label: 'A high-trust community of like-minded peers' }
        ]
      },
      {
        id: 4,
        title: 'How confident do you feel navigating unexpected life transitions?',
        description: 'When sudden shifts or disruptions occur in work or life.',
        required: true,
        options: [
          { id: 'unshakable', badge: 'A', label: 'Extremely confident — I adapt quickly with composure' },
          { id: 'steady', badge: 'B', label: 'Mostly steady, though it takes a moment to calibrate' },
          { id: 'challenged', badge: 'C', label: 'Somewhat challenged — transitions feel draining' },
          { id: 'overwhelmed', badge: 'D', label: 'Easily overwhelmed by sudden changes' }
        ]
      }
    ];

    let currentIndex = 0;
    let answers = {};
    let isCompleted = false;
    let autoAdvanceTimer = null;
    let isTransitioning = false;

    const cardContainer = document.getElementById('card-container');
    const progressFill = document.getElementById('progress-fill');
    const btnNavPrev = document.getElementById('btn-nav-prev');
    const btnNavNext = document.getElementById('btn-nav-next');
    const brandStepCounter = document.getElementById('brand-step-counter');

    function renderQuestion(direction = 1) {
      if (isCompleted) {
        renderCompleted();
        return;
      }

      const q = QUESTIONS[currentIndex];
      const selected = answers[q.id];
      const percent = ((currentIndex + 1) / QUESTIONS.length) * 100;
      progressFill.style.width = percent + '%';
      brandStepCounter.textContent = `${currentIndex + 1} of ${QUESTIONS.length}`;

      btnNavPrev.disabled = currentIndex === 0;
      btnNavNext.disabled = false;

      const html = `
        <div class="mb-6">
          <div class="flex items-baseline gap-2 mb-2">
            <span class="text-sm font-semibold tracking-wide text-[#e91e63]">${q.id} &rarr;</span>
            <h1 class="text-xl sm:text-2xl md:text-3xl font-semibold text-neutral-900 leading-snug tracking-tight">
              ${q.title} ${q.required ? '<span class="text-[#e91e63] ml-1">*</span>' : ''}
            </h1>
          </div>
          ${q.description ? `<p class="text-neutral-500 text-sm sm:text-base font-normal ml-6">${q.description}</p>` : ''}
        </div>

        <div class="flex flex-col gap-3 my-2" role="radiogroup">
          ${q.options.map(opt => {
            const isSel = selected === opt.id;
            return `
              <button
                type="button"
                data-option-id="${opt.id}"
                data-badge="${opt.badge}"
                class="option-btn group relative flex items-center justify-between w-full p-3.5 sm:p-4 rounded-xl border text-left transition-all duration-150 cursor-pointer ${
                  isSel
                    ? 'border-[#e91e63] bg-pink-50/60 ring-2 ring-[#e91e63]/20 shadow-sm'
                    : 'border-neutral-200/90 bg-white/90 hover:border-neutral-300 hover:bg-neutral-50/80 shadow-sm'
                }"
              >
                <div class="flex items-center gap-3 sm:gap-4 flex-1 pr-2">
                  <span class="flex items-center justify-center w-7 h-7 sm:w-8 sm:h-8 rounded-md text-xs font-bold border transition-colors duration-150 ${
                    isSel
                      ? 'bg-[#e91e63] text-white border-[#e91e63] shadow-xs'
                      : 'bg-neutral-100 text-neutral-600 border-neutral-300 group-hover:bg-neutral-200'
                  }">
                    ${opt.badge}
                  </span>
                  <span class="text-sm sm:text-base font-medium transition-colors ${
                    isSel ? 'text-neutral-900 font-semibold' : 'text-neutral-700'
                  }">
                    ${opt.label}
                  </span>
                </div>
                <div class="flex items-center justify-center w-5 h-5 text-[#e91e63]">
                  ${isSel ? '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>' : ''}
                </div>
              </button>
            `;
          }).join('')}
        </div>

        <div id="validation-msg" class="hidden flex items-center gap-1.5 mt-2 text-xs font-medium text-red-600">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/></svg>
          <span>Please choose an option to continue</span>
        </div>

        <div class="flex items-center gap-3 mt-6">
          <button
            id="btn-ok"
            type="button"
            class="flex items-center gap-2 px-6 py-2.5 rounded-lg bg-[#e91e63] hover:bg-[#d81557] active:scale-95 text-white font-medium text-sm sm:text-base shadow-sm transition-all cursor-pointer"
          >
            <span>OK</span>
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
          </button>
          <span class="text-xs text-neutral-400 font-normal">
            press <strong class="font-semibold text-neutral-600">Enter ↵</strong>
          </span>
        </div>
      `;

      cardContainer.innerHTML = html;

      // Event listeners on options
      cardContainer.querySelectorAll('.option-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const optId = btn.getAttribute('data-option-id');
          selectOption(optId);
        });
      });

      // OK Button listener
      const btnOk = document.getElementById('btn-ok');
      if (btnOk) {
        btnOk.addEventListener('click', handleNext);
      }
    }

    function renderCompleted() {
      progressFill.style.width = '100%';
      brandStepCounter.textContent = 'Completed';
      btnNavPrev.disabled = true;
      btnNavNext.disabled = true;

      cardContainer.innerHTML = `
        <div class="w-full text-center py-12 px-6 bg-white/80 backdrop-blur-md rounded-2xl shadow-sm border border-neutral-200/80">
          <div class="w-16 h-16 bg-pink-100 text-[#e91e63] rounded-full flex items-center justify-center mx-auto mb-5 shadow-inner">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
          </div>
          <h2 class="text-2xl sm:text-3xl font-bold text-neutral-900 mb-2">All Done! Thank you.</h2>
          <p class="text-neutral-500 text-sm sm:text-base max-w-md mx-auto mb-8">
            Your responses have been recorded. You can restart the survey anytime.
          </p>
          <button
            id="btn-restart"
            type="button"
            class="px-6 py-2.5 bg-neutral-900 hover:bg-neutral-800 text-white rounded-lg text-sm font-medium transition-colors shadow-sm"
          >
            Restart Survey
          </button>
        </div>
      `;

      document.getElementById('btn-restart').addEventListener('click', () => {
        answers = {};
        currentIndex = 0;
        isCompleted = false;
        transitionTo(0, 1);
      });
    }

    function selectOption(optionId) {
      const q = QUESTIONS[currentIndex];
      answers[q.id] = optionId;

      clearTimeout(autoAdvanceTimer);
      renderQuestion();

      // Auto-advance after 300ms dwell delay
      autoAdvanceTimer = setTimeout(() => {
        handleNext();
      }, 300);
    }

    function transitionTo(nextIdx, direction) {
      if (isTransitioning) return;
      isTransitioning = true;
      clearTimeout(autoAdvanceTimer);

      const exitClass = direction > 0 ? 'slide-exit-up' : 'slide-exit-down';
      const enterClass = direction > 0 ? 'slide-enter-down' : 'slide-enter-up';

      cardContainer.className = `w-full flex flex-col justify-center ${exitClass}`;

      setTimeout(() => {
        currentIndex = nextIdx;
        renderQuestion(direction);
        cardContainer.className = `w-full flex flex-col justify-center ${enterClass}`;
        setTimeout(() => {
          isTransitioning = false;
        }, 300);
      }, 240);
    }

    function handleNext() {
      clearTimeout(autoAdvanceTimer);
      const q = QUESTIONS[currentIndex];
      if (q.required && !answers[q.id]) {
        const valMsg = document.getElementById('validation-msg');
        if (valMsg) valMsg.classList.remove('hidden');
        return;
      }

      if (currentIndex < QUESTIONS.length - 1) {
        transitionTo(currentIndex + 1, 1);
      } else {
        isCompleted = true;
        renderCompleted();
      }
    }

    function handlePrev() {
      clearTimeout(autoAdvanceTimer);
      if (currentIndex > 0) {
        transitionTo(currentIndex - 1, -1);
      }
    }

    btnNavPrev.addEventListener('click', handlePrev);
    btnNavNext.addEventListener('click', handleNext);

    // Keyboard support
    window.addEventListener('keydown', (e) => {
      if (isCompleted || isTransitioning) return;
      const key = e.key.toUpperCase();

      const q = QUESTIONS[currentIndex];
      const matched = q.options.find(opt => opt.badge === key);
      if (matched) {
        e.preventDefault();
        selectOption(matched.id);
        return;
      }

      if (e.key === 'Enter') {
        e.preventDefault();
        handleNext();
        return;
      }

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        handleNext();
        return;
      }

      if (e.key === 'ArrowUp') {
        e.preventDefault();
        handlePrev();
        return;
      }
    });

    // Initial render
    renderQuestion(1);
  </script>
</body>
</html>
